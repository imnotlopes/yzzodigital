<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Antes de tudo: marca que há JavaScript. O que anima ao entrar na tela só
      se esconde com esta classe (ver o `.js` em src/index.css); sem
      JavaScript, a página vem inteira e visível, do jeito que o build montou.
    -->
    <script>document.documentElement.classList.add('js')</script>
    <meta name="theme-color" content="#F3F3F3" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      As tags de compartilhamento ficam ESCRITAS AQUI, e não montadas pelo
      React: o robô que monta o cartão do link no WhatsApp e no Instagram não
      executa JavaScript. O que não estiver neste arquivo, ele não vê.

      TODO: as URLs absolutas abaixo usam o endereço provisório. Trocar junto
      com SITE_URL em src/lib/brand.ts quando houver domínio.
    -->
    <title>Yzzo Digital | Agência de marketing esportivo</title>
    <meta name="description" content="Artes e conteúdo visual para o futebol: Match Days, Motion, convocação, novo clube e DVD esportivo. Pacotes para atletas a partir de R$ 100 por mês. +700 projetos." />
    <link rel="canonical" href="https://yzzodigital.vercel.app/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Yzzo Digital" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="Yzzo Digital | Agência de marketing esportivo" />
    <meta property="og:description" content="Seu desempenho fala por você. Sua imagem também deveria." />
    <meta property="og:url" content="https://yzzodigital.vercel.app/" />
    <meta property="og:image" content="https://yzzodigital.vercel.app/og-yzzo.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Atleta de costas com a camisa 20, ao lado da frase da Yzzo Digital." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Yzzo Digital | Agência de marketing esportivo" />
    <meta name="twitter:description" content="Seu desempenho fala por você. Sua imagem também deveria." />
    <meta name="twitter:image" content="https://yzzodigital.vercel.app/og-yzzo.jpg" />

    <!--
      A foto da capa começa a baixar junto com o resto, sem esperar o
      JavaScript montar a página: no 4G fraco eram uns dois segundos de capa
      vazia. O `imagesrcset` e o `imagesizes` são os mesmos da <Foto> de
      src/components/Capa.tsx; se um mudar, o outro muda junto, ou a foto
      baixa duas vezes. Navegador sem AVIF ignora a linha.
    -->
    <link rel="preload" as="image" type="image/avif" href="/fotos/camisa-20.avif" imagesrcset="/fotos/camisa-20-320.avif 320w, /fotos/camisa-20-600.avif 600w, /fotos/camisa-20-800.avif 800w, /fotos/camisa-20-1080.avif 1080w, /fotos/camisa-20.avif 1280w" imagesizes="(max-width: 480px) 360px, (max-width: 1023px) 100vw, 56vw" fetchpriority="high" />

    <!--
      As duas fontes da primeira tela (o título e o texto) começam a baixar
      junto com a página. As outras vêm quando aparecem; até lá, o texto usa
      as fontes de reserva, medidas para ocupar o mesmo espaço (ver o começo
      de src/index.css), e por isso a troca não faz a página pular.
    -->
    <link rel="preload" as="font" type="font/woff2" href="/fontes/sofia-700.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fontes/poppins-400.woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
